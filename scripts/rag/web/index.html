<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3GPP Rel-19 · RAG</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a22; --panel2: #1d2330; --line: #262d3b;
    --txt: #e7ecf3; --muted: #8b95a7; --accent: #4f8cff; --accent2: #22c98a;
    --user: #22314d; --warn: #ffb020; --err: #ff5d5d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--txt);
    font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .app { display: flex; height: 100%; --activity-w: 300px; }
  aside {
    width: 280px; flex: 0 0 280px; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
  }
  .brand { padding: 18px 16px 10px; font-weight: 700; letter-spacing: .3px; }
  .brand span { color: var(--accent); }
  .new-btn {
    margin: 0 12px 12px; padding: 10px 12px; border-radius: 9px; cursor: pointer;
    background: var(--accent); color: #fff; border: 0; font-weight: 600;
  }
  .new-btn:hover { filter: brightness(1.08); }
  #sessions { overflow: auto; flex: 1; padding: 0 8px 12px; }
  .sess {
    padding: 9px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    color: var(--muted); border: 1px solid transparent;
    display: flex; align-items: center; gap: 6px;
  }
  .sess:hover { background: var(--panel2); }
  .sess.active { background: var(--panel2); border-color: var(--line); color: var(--txt); }
  .sess-main { flex: 1; min-width: 0; }
  .sess-del {
    flex: 0 0 auto; opacity: 0; border: 0; background: transparent; color: var(--muted);
    cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 5px; border-radius: 6px;
    transition: opacity .15s, color .15s, background .15s;
  }
  .sess:hover .sess-del, .sess.active .sess-del { opacity: .6; }
  .sess-del:hover { opacity: 1; color: #ff7b7b; background: rgba(255, 123, 123, .12); }
  .sess b { display: block; font-weight: 600; font-size: 13.5px; color: inherit;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess small { font-size: 11.5px; opacity: .8; }
  .foot { padding: 10px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  aside.activity {
    width: var(--activity-w); flex: 0 0 var(--activity-w); background: var(--panel);
    border-left: 1px solid var(--line); display: flex; flex-direction: column;
    min-width: 0;
  }
  .app.act-hidden aside.activity, .app.act-hidden .resizer { display: none; }
  .resizer { flex: 0 0 5px; cursor: col-resize; transition: background .15s; }
  .resizer:hover, .resizer.dragging { background: var(--accent); opacity: .45; }
  .act-head {
    padding: 15px 16px 10px; display: flex; flex-direction: column; gap: 5px;
    border-bottom: 1px solid var(--line);
  }
  .act-title { font-weight: 700; font-size: 14px; letter-spacing: .3px; }
  .act-status { font-size: 11.5px; color: var(--muted); }
  .act-status.busy { color: #9dc0ff; }
  .act-status.ok { color: var(--accent2); }
  .act-status.err { color: var(--err); }
  .act-list { flex: 1; overflow: auto; padding: 8px 10px 16px; }
  .act-empty { color: var(--muted); font-size: 12.5px; padding: 14px 8px; line-height: 1.5; }
  .act-group { margin-bottom: 4px; }
  .act-turn {
    width: 100%; display: flex; align-items: center; gap: 6px; background: transparent;
    border: 0; border-top: 1px dashed var(--line); color: var(--muted); cursor: pointer;
    font-size: 11px; text-transform: uppercase; letter-spacing: .6px; text-align: left;
    padding: 9px 6px 4px; margin-top: 4px;
  }
  .act-group:first-child .act-turn { border-top: 0; margin-top: 0; padding-top: 4px; }
  .act-turn::before { content: "▾"; font-size: 10px; }
  .act-turn.closed::before { content: "▸"; }
  .act-step { position: relative; display: flex; gap: 8px; padding: 4px 2px; align-items: flex-start; }
  .act-step::before {
    content: ""; position: absolute; left: 18px; top: 0; bottom: 0; width: 1px;
    background: var(--line);
  }
  .act-step:last-of-type::before { bottom: 50%; }
  .act-icon {
    position: relative; z-index: 1; flex: 0 0 18px; width: 18px; height: 18px;
    display: grid; place-items: center; background: var(--panel); border-radius: 50%;
    font-size: 12px; color: var(--accent2); margin-top: 4px;
  }
  .act-step.pending .act-icon { color: var(--accent); }
  .spin {
    width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid rgba(79, 140, 255, .3); border-top-color: var(--accent);
    animation: actspin .8s linear infinite;
  }
  @keyframes actspin { to { transform: rotate(360deg); } }
  .act-card {
    flex: 1; min-width: 0; border: 1px solid transparent; border-radius: 8px;
    padding: 1px 2px 2px; transition: background .15s, border-color .15s;
  }
  .act-step.pending .act-card {
    border-color: rgba(79, 140, 255, .35); background: rgba(79, 140, 255, .06);
  }
  .act-step.done:hover .act-card { background: var(--panel2); }
  .act-summary {
    width: 100%; display: flex; align-items: baseline; gap: 8px; padding: 4px 6px;
    background: transparent; border: 0; color: inherit; text-align: left; cursor: pointer;
  }
  .act-summary.static { cursor: default; }
  .act-step.has-detail .act-summary::after { content: "▸"; font-size: 10px; color: var(--muted); }
  .act-step.has-detail.open .act-summary::after { content: "▾"; }
  .act-label {
    flex: 1; min-width: 0; font-size: 12.5px; color: var(--txt);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .act-step.pending .act-label { color: #cfe0ff; }
  .act-ms { flex: 0 0 auto; font-size: 10.5px; color: var(--muted); }
  .act-meta {
    font-size: 11px; color: var(--muted); margin: 0 6px 4px; word-break: break-word;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .act-detail {
    margin: 0 6px 6px; padding-top: 5px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: #b7c1d1; line-height: 1.55; word-break: break-word;
  }
  .act-detail > div + div { margin-top: 2px; }
  .act-foot {
    margin: 2px 4px 8px 26px; padding: 6px 8px; border-top: 1px dashed var(--line);
    font-size: 10.5px; color: var(--muted); line-height: 1.6;
  }
  .head-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ghost-btn {
    background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 8px; padding: 5px 9px; cursor: pointer; font-size: 14px; line-height: 1;
  }
  .ghost-btn:hover { border-color: var(--accent); color: #fff; }
  #act-backdrop { display: none; }
  header {
    padding: 14px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .hint { color: var(--muted); font-size: 12px; }
  #chat { flex: 1; overflow: auto; padding: 24px 22px 8px; }
  .wrap { max-width: 880px; margin: 0 auto; }
  .msg { margin-bottom: 20px; display: flex; gap: 10px; }
  .msg .who {
    flex: 0 0 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; background: var(--panel2); color: var(--muted);
  }
  .msg.user .who { background: var(--user); color: #bcd2ff; }
  .msg.ai .who { background: #173229; color: #7ee2b8; }
  .bubble { flex: 1; min-width: 0; }
  .bubble .text { word-wrap: break-word; }
  .msg.user .text {
    background: var(--user); padding: 10px 14px; border-radius: 12px; display: inline-block;
    max-width: 100%; white-space: pre-wrap;
  }
  .text h4 { margin: 16px 0 6px; font-size: 14.5px; color: #cfe0ff; }
  .text p { margin: 6px 0; }
  .text ul { margin: 6px 0; padding-left: 22px; }
  .text li { margin: 3px 0; }
  .text blockquote {
    margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--warn);
    background: #2a2413; border-radius: 6px; color: #ffd98a;
  }
  .text code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .cite { color: var(--accent); font-weight: 600; cursor: pointer; }
  .gap { height: 6px; }
  .sources { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .sources .head { font-size: 12px; color: var(--muted); text-transform: uppercase;
                   letter-spacing: .6px; margin-bottom: 6px; }
  .sources ol { margin: 0; padding-left: 20px; }
  .sources li { margin: 6px 0; font-size: 13px; color: #c6cfdd; }
  .tag { background: #1c2b45; color: #9dc0ff; border-radius: 5px; padding: 1px 6px;
         font-size: 12px; font-weight: 600; }
  .sources details { margin-top: 3px; color: var(--muted); }
  .sources summary { cursor: pointer; font-size: 12px; }
  .sources details p { margin: 6px 0 0; font-size: 12.5px; line-height: 1.5; }
  .status { color: var(--muted); font-size: 12.5px; font-style: italic; margin: 4px 0 10px; }
  .err { color: var(--err); }
  #composer { padding: 12px 22px 20px; }
  .composer-inner {
    max-width: 880px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px;
  }
  #q {
    flex: 1; resize: none; background: transparent; border: 0; color: var(--txt);
    font: inherit; outline: none; max-height: 180px; padding: 4px 6px;
  }
  #send {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 9px 18px; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }
  .empty { text-align: center; color: var(--muted); margin-top: 12vh; }
  .empty h2 { color: var(--txt); font-size: 22px; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chip { background: var(--panel); border: 1px solid var(--line); color: #cfd8e6;
          border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  .chip:hover { border-color: var(--accent); color: #fff; }
  @media (max-width: 1100px) {
    aside.activity {
      position: fixed; right: 0; top: 0; bottom: 0; width: min(88vw, 360px);
      z-index: 50; box-shadow: -12px 0 32px rgba(0, 0, 0, .45);
    }
    .resizer { display: none; }
    .app.act-hidden aside.activity { display: none; }
    .app:not(.act-hidden) #act-backdrop {
      display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 45;
    }
  }
  @media (max-width: 760px) {
    aside { display: none; }
    header { padding: 12px 14px; }
    #chat, #composer { padding-left: 12px; padding-right: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">3GPP <span>Rel-19</span> · RAG</div>
    <button class="new-btn" id="new">+ Phiên mới</button>
    <div id="sessions"></div>
    <div class="foot" id="health">đang kết nối…</div>
  </aside>

  <main>
    <header>
      <h1>Trợ lý tài liệu 3GPP Release 19</h1>
      <div class="head-right">
        <div class="hint" id="hint">hybrid 70% vector · 30% BM25</div>
        <button class="ghost-btn" id="act-toggle" type="button"
                title="Ẩn/hiện cột Hoạt động">◧</button>
      </div>
    </header>
    <div id="chat"><div class="wrap" id="wrap"></div></div>
    <form id="composer">
      <div class="composer-inner">
        <textarea id="q" rows="1" placeholder="Hỏi về tài liệu 3GPP Rel-19 (vd: TS 23.501 quy định gì về PDU Session?)"></textarea>
        <button id="send" type="submit">Gửi</button>
      </div>
    </form>
  </main>

  <div class="resizer" id="resizer" role="separator" aria-orientation="vertical"
       aria-label="Kéo để đổi độ rộng cột Hoạt động" tabindex="0"
       title="Kéo để đổi độ rộng · nháy đúp để mặc định"></div>

  <aside class="activity" id="activity">
    <div class="act-head">
      <div class="act-title">Hoạt động</div>
      <div class="act-status" id="act-status">Chưa có hoạt động</div>
    </div>
    <div class="act-list" id="act-list">
      <div class="act-empty">Gửi câu hỏi để xem các bước chatbot đang thực hiện.</div>
    </div>
  </aside>
  <div id="act-backdrop"></div>
</div>

<script>
const state = { sid: null, sending: false, controller: null };
const $ = (s) => document.querySelector(s);
const wrap = $("#wrap");
const app = $(".app");
const actList = $("#act-list");
const actStatus = $("#act-status");

const AGENT_LABEL = {
  history: "Nạp lịch sử hội thoại",
  supervisor: "Phân tích câu hỏi",
  retrieve: "Tìm tài liệu (dense + BM25)",
  merge: "Gộp kết quả",
  grader: "Chấm độ liên quan",
  synthesizer: "Viết câu trả lời",
  verifier: "Kiểm tra trích dẫn",
  persist: "Lưu phiên",
};
let act = { rows: {}, round: -1, started: 0, body: null };

const PRICE = {
  "openai/gpt-4o-mini": [0.15, 0.60],
  "openai/gpt-5-mini": [0.25, 2.00],
  "openai/gpt-4.1-mini": [0.40, 1.60],
};

function costOf(calls) {
  let tin = 0, tout = 0, cost = 0;
  const models = new Set();
  for (const c of calls || []) {
    const p = PRICE[c.model] || [0, 0];
    const i = Number(c.input_tokens ?? c.tokens_in ?? 0) || 0;
    const o = Number(c.output_tokens ?? c.tokens_out ?? 0) || 0;
    tin += i;
    tout += o;
    cost += (i * p[0] + o * p[1]) / 1e6;
    if (c.model) models.add(c.model.replace("openai/", ""));
  }
  return { tin, tout, cost, models: [...models] };
}

function fmtTok(n) {
  return n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
}

function actFoot(calls) {
  const { tin, tout, cost, models } = costOf(calls);
  if (!tin && !tout) return;
  const el = document.createElement("div");
  el.className = "act-foot";
  const a = document.createElement("div");
  a.textContent = `${(calls || []).length} lời gọi · ${fmtTok(tin)}→${fmtTok(tout)} token`;
  const b = document.createElement("div");
  b.textContent = `${models.join(", ")} · ≤ $${cost.toFixed(4)} (ước tính)`;
  el.append(a, b);
  (act.body || actList).appendChild(el);
}

function actGroup(label) {
  const g = document.createElement("div");
  g.className = "act-group";
  const head = document.createElement("button");
  head.type = "button";
  head.className = "act-turn";
  head.textContent = label;
  const body = document.createElement("div");
  body.className = "act-group-body";
  head.addEventListener("click", () => {
    body.hidden = !body.hidden;
    head.classList.toggle("closed", body.hidden);
  });
  g.append(head, body);
  actList.appendChild(g);
  return body;
}

function actEnsureRound(r) {
  const n = Number(r) || 0;
  if (n > act.round) {
    act.round = n;
    act.body = n > 0 ? actGroup(`Tìm lại · vòng ${n + 1}`) : null;
  }
}

function actStatusSet(text, cls) {
  actStatus.textContent = text;
  actStatus.className = "act-status" + (cls ? " " + cls : "");
}

function actReset() {
  act = { rows: {}, round: -1, started: 0, body: null };
  actList.innerHTML =
    '<div class="act-empty">Gửi câu hỏi để xem các bước chatbot đang thực hiện.</div>';
  actStatusSet("Chưa có hoạt động");
}

function actStart() {
  act = { rows: {}, round: -1, started: Date.now(), body: null };
  actList.innerHTML = "";
  actStatusSet("● Đang xử lý…", "busy");
}

function actMeta(ev) {
  const m = ev.meta || {};
  switch (ev.node) {
    case "history":
      return m.turns ? `dùng ${m.turns} lượt hội thoại trước` : "không có lịch sử";
    case "supervisor": {
      const parts = [];
      if ((m.specs || []).length) parts.push("spec " + m.specs.join(", "));
      if ((m.sub_queries || []).length) parts.push(`${m.sub_queries.length} truy vấn`);
      return parts.join(" · ");
    }
    case "retrieve": {
      const q = (m.sub_query || "").slice(0, 80);
      return `${q ? q + " · " : ""}${m.hits ?? 0} đoạn`;
    }
    case "merge":
      return `${m.evidence ?? 0} đoạn sau khi gộp`;
    case "grader":
      return `giữ ${m.kept ?? 0}/${m.total ?? "?"} đoạn · ` +
             `${m.sufficient ? "đủ thông tin" : "cần tìm lại"}`;
    case "synthesizer":
      return `${(m.chars ?? 0).toLocaleString("vi-VN")} ký tự · ${m.citations ?? 0} nguồn`;
    case "verifier":
      return m.ok ? "trích dẫn hợp lệ" : `${(m.issues || []).length} vấn đề`;
    case "persist":
      return "đã lưu vào SQLite";
    default:
      return "";
  }
}

function actDetails(ev) {
  const m = ev.meta || {};
  if (m.error) return ["Lỗi: " + m.error];
  const out = [];
  switch (ev.node) {
    case "history":
      out.push(`Lịch sử: ${m.turns ?? 0} lượt hội thoại`);
      break;
    case "supervisor":
      if ((m.specs || []).length) out.push("Spec: " + m.specs.join(", "));
      (m.sub_queries || []).forEach((q, i) => out.push(`Truy vấn ${i + 1}: ${q}`));
      break;
    case "retrieve":
      if (m.sub_query) out.push("Truy vấn: " + m.sub_query);
      out.push(`Số đoạn tìm được: ${m.hits ?? 0}`);
      break;
    case "merge":
      out.push(`Sau khi gộp/khử trùng: ${m.evidence ?? 0} đoạn`);
      break;
    case "grader":
      out.push(`Giữ lại: ${m.kept ?? 0}/${m.total ?? "?"} đoạn`);
      out.push("Kết luận: " + (m.sufficient ? "đủ thông tin để trả lời" : "cần tìm lại"));
      break;
    case "synthesizer":
      out.push(`Độ dài: ${m.chars ?? 0} ký tự`);
      out.push(`Trích dẫn: ${m.citations ?? 0} nguồn`);
      break;
    case "verifier":
      out.push(m.ok ? "Trích dẫn hợp lệ" : "Vấn đề: " + (m.issues || []).join("; "));
      break;
    case "persist":
      out.push(`Turn ID: ${m.turn_id ?? "?"}`);
      break;
  }
  return out;
}

function setDetails(el, lines) {
  const d = el.querySelector(".act-detail");
  d.innerHTML = "";
  for (const line of lines) {
    const div = document.createElement("div");
    div.textContent = line;
    d.appendChild(div);
  }
  el.classList.toggle("has-detail", lines.length > 0);
}

function actRow(node) {
  const el = document.createElement("div");
  el.className = "act-step pending";
  el.innerHTML = '<span class="act-icon"><span class="spin"></span></span>' +
    '<div class="act-card">' +
      '<button class="act-summary" type="button">' +
        '<span class="act-label"></span><span class="act-ms"></span>' +
      '</button>' +
      '<div class="act-meta"></div>' +
      '<div class="act-detail" hidden></div>' +
    '</div>';
  el.querySelector(".act-label").textContent = AGENT_LABEL[node] || node;
  el.querySelector(".act-summary").addEventListener("click", () => {
    if (!el.classList.contains("has-detail")) return;
    const d = el.querySelector(".act-detail");
    d.hidden = !d.hidden;
    el.classList.toggle("open", !d.hidden);
  });
  (act.body || actList).appendChild(el);
  return el;
}

function actStep(ev) {
  actEnsureRound(ev.round);
  if (ev.phase === "start") {
    act.rows[ev.run_id] = actRow(ev.node);
  } else {
    const el = act.rows[ev.run_id] || actRow(ev.node);
    el.classList.remove("pending");
    el.classList.add("done");
    const failed = !!(ev.meta && ev.meta.error);
    el.querySelector(".act-icon").textContent = failed ? "✕" : "✓";
    if (failed) el.querySelector(".act-icon").style.color = "var(--err)";
    const meta = failed ? ev.meta.error : actMeta(ev);
    if (meta) el.querySelector(".act-meta").textContent = meta;
    if (ev.ms != null) el.querySelector(".act-ms").textContent = (ev.ms / 1000).toFixed(1) + "s";
    setDetails(el, actDetails(ev));
  }
  actList.scrollTop = actList.scrollHeight;
}

function actDone(ev) {
  const secs = act.started ? ((Date.now() - act.started) / 1000).toFixed(0) : "?";
  actStatusSet(`✓ Hoàn tất · ${secs}s · ${(ev.citations || []).length} nguồn`, "ok");
  actFoot(ev.usage || []);
}

function actError(msg) {
  actStatusSet("✕ Lỗi: " + (msg || "không rõ"), "err");
}

function actCalls(calls, turns) {
  act = { rows: {}, round: -1, started: 0, body: null };
  actList.innerHTML = "";
  if (!calls || !calls.length) {
    actList.innerHTML = '<div class="act-empty">Chưa có dữ liệu hoạt động cho phiên này.</div>';
    actStatusSet(`Lịch sử · ${turns} lượt`);
    return;
  }
  let cur = null, group = [], body = null;
  const flush = () => {
    if (!group.length) return;
    act.body = body;
    actFoot(group);
    group = [];
  };
  for (const c of calls) {
    if (c.turn_index !== cur) {
      flush();
      cur = c.turn_index;
      body = actGroup(`Lượt ${cur}`);
      act.body = body;
    }
    const el = document.createElement("div");
    el.className = "act-step done";
    el.innerHTML = '<span class="act-icon">•</span><div class="act-card">' +
      '<div class="act-summary static"><span class="act-label"></span><span class="act-ms"></span></div>' +
      '<div class="act-meta"></div></div>';
    el.querySelector(".act-label").textContent = AGENT_LABEL[c.agent] || c.agent;
    el.querySelector(".act-meta").textContent =
      `${(c.model || "").replace("openai/", "")} · ${c.tokens_in || 0}→${c.tokens_out || 0} token`;
    el.querySelector(".act-ms").textContent =
      c.latency_ms ? (c.latency_ms / 1000).toFixed(1) + "s" : "";
    body.appendChild(el);
    group.push(c);
  }
  flush();
  actStatusSet(`Lịch sử · ${turns} lượt`);
}

const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function inline(s) {
  return s
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[(\d{1,2})\]/g, '<span class="cite" data-n="$1">[$1]</span>');
}

function md(text) {
  const lines = esc(text || "").split("\n");
  let html = "", inUl = false;
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, "");
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      if (inUl) { html += "</ul>"; inUl = false; }
      html += `<h4>${inline(h[2])}</h4>`;
      continue;
    }
    if (/^\s*[-*]\s+/.test(line)) {
      if (!inUl) { html += "<ul>"; inUl = true; }
      html += `<li>${inline(line.replace(/^\s*[-*]\s+/, ""))}</li>`;
      continue;
    }
    if (inUl) { html += "</ul>"; inUl = false; }
    if (!line.trim()) { html += '<div class="gap"></div>'; continue; }
    if (/^&gt;\s?/.test(line)) {
      html += `<blockquote>${inline(line.replace(/^&gt;\s?/, ""))}</blockquote>`;
      continue;
    }
    html += `<p>${inline(line)}</p>`;
  }
  if (inUl) html += "</ul>";
  return html;
}

function addUser(text) {
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = '<div class="who">Bạn</div><div class="bubble"><div class="text"></div></div>';
  el.querySelector(".text").textContent = text;
  wrap.appendChild(el);
  scrollDown();
}

function addAI() {
  const el = document.createElement("div");
  el.className = "msg ai";
  el.innerHTML = '<div class="who">AI</div><div class="bubble">' +
    '<div class="status">Đang xử lý…</div><div class="text"></div>' +
    '<div class="sources" hidden></div></div>';
  wrap.appendChild(el);
  scrollDown();
  return el;
}

function renderSources(el, citations) {
  const box = el.querySelector(".sources");
  if (!citations || !citations.length) { box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = `<div class="head">Nguồn (${citations.length})</div><ol>` +
    citations.map((c) => `
      <li id="src-${c.rank}">
        <span class="tag">TS ${esc(c.spec)}</span> v${esc(c.version)} §${esc(c.section || "—")}
        — ${esc(c.title || "")}
        <details><summary>trích đoạn</summary><p>${esc(c.snippet || "")}</p></details>
      </li>`).join("") + "</ol>";
}

function scrollDown() { const c = $("#chat"); c.scrollTop = c.scrollHeight; }

function setBusy(busy) {
  state.sending = busy;
  $("#send").disabled = busy;
  $("#q").disabled = busy;
}

function clearChat() {
  actReset();
  wrap.innerHTML = `
    <div class="empty">
      <h2>Hỏi về tài liệu 3GPP Rel-19</h2>
      <div>Câu trả lời chỉ dựa trên tài liệu đã nạp, luôn kèm trích dẫn nguồn.</div>
      <div class="chips">
        <button class="chip">TS 23.501 quy định gì về PDU Session?</button>
        <button class="chip">So sánh 4G và 5G về QoS flow</button>
        <button class="chip">TS 38.304 quy định gì về cell selection?</button>
      </div>
    </div>`;
  wrap.querySelectorAll(".chip").forEach((b) =>
    b.addEventListener("click", () => { $("#q").value = b.textContent; send(); }));
}

async function loadHealth() {
  try {
    const r = await fetch("/api/health");
    const h = await r.json();
    const q = h.quota || {};
    $("#health").textContent = q.limit
      ? `${h.synth_model} · ${Math.max(0, q.limit - q.used)}/${q.limit} câu còn lại`
      : `${h.synth_model} · ${h.profile}`;
    $("#hint").textContent = `hybrid 70% vector · 30% BM25 · ${h.sparse_collection}`;
    if (q.max_chars) $("#q").maxLength = q.max_chars;
    return h;
  } catch (e) {
    $("#health").textContent = "mất kết nối API";
  }
}

async function loadSessions(active) {
  const box = $("#sessions");
  try {
    const r = await fetch("/api/sessions");
    const list = await r.json();
    box.innerHTML = "";
    for (const s of list) {
      const el = document.createElement("div");
      el.className = "sess" + (s.id === active ? " active" : "");
      const main = document.createElement("div");
      main.className = "sess-main";
      main.innerHTML = "<b></b><small></small>";
      main.querySelector("b").textContent = s.title || "Phiên mới";
      main.querySelector("small").textContent = `${s.turns} lượt · ${(s.updated_at || "").slice(5, 16)}`;
      main.addEventListener("click", () => openSession(s.id));
      const del = document.createElement("button");
      del.className = "sess-del";
      del.type = "button";
      del.title = "Xoá phiên";
      del.textContent = "×";
      del.addEventListener("click", async (ev) => {
        ev.stopPropagation();
        if (!confirm(`Xoá "${s.title || "Phiên mới"}"?`)) return;
        try {
          await fetch(`/api/sessions/${s.id}`, { method: "DELETE" });
          if (state.sid === s.id) newSession();
          else loadSessions(active);
        } catch (e) {
          alert("Không xoá được phiên: " + e);
        }
      });
      el.appendChild(main);
      el.appendChild(del);
      box.appendChild(el);
    }
  } catch (e) { /* ignore */ }
}

async function openSession(sid) {
  state.sid = sid;
  wrap.innerHTML = "";
  try {
    const r = await fetch(`/api/sessions/${sid}`);
    const data = await r.json();
    for (const t of data.turns || []) {
      addUser(t.question);
      const el = addAI();
      el.querySelector(".status").remove();
      el.querySelector(".text").innerHTML = md(t.answer || "");
      renderSources(el, t.citations || []);
    }
    if (!(data.turns || []).length) clearChat();
    actCalls(data.calls || [], (data.turns || []).length);
    loadSessions(sid);
    scrollDown();
  } catch (e) {
    wrap.innerHTML = `<div class="err">Không tải được phiên: ${esc(String(e))}</div>`;
  }
}

function newSession() {
  state.sid = null;
  clearChat();
  loadSessions(null);
  $("#q").focus();
}

async function send() {
  const text = $("#q").value.trim();
  if (!text || state.sending) return;
  $("#q").value = "";
  $("#q").style.height = "auto";
  addUser(text);

  const el = addAI();
  const status = el.querySelector(".status");
  const out = el.querySelector(".text");
  let buffer = "", raf = 0;
  actStart();

  const paint = () => {
    raf = 0;
    out.innerHTML = md(buffer);
    scrollDown();
  };

  setBusy(true);
  try {
    const res = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: state.sid, question: text }),
    });
    if (!res.ok) {
      let detail = `HTTP ${res.status}`;
      try {
        const err = await res.json();
        if (err && err.detail) detail = err.detail;
      } catch (e) { /* khong phai JSON */ }
      throw new Error(detail);
    }
    if (!res.body) throw new Error("trình duyệt không hỗ trợ streaming");

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        for (const line of raw.split("\n")) {
          if (!line.startsWith("data: ")) continue;
          const ev = JSON.parse(line.slice(6));
          if (ev.type === "session") {
            state.sid = ev.session_id;
            loadSessions(state.sid);
          } else if (ev.type === "step") {
            actStep(ev);
          } else if (ev.type === "token") {
            if (status) status.remove();
            buffer += ev.text;
            if (!raf) raf = requestAnimationFrame(paint);
          } else if (ev.type === "error") {
            if (status) status.remove();
            actError(ev.message);
            out.innerHTML += `<p class="err">Lỗi: ${esc(ev.message)}</p>`;
          } else if (ev.type === "done") {
            if (status) status.remove();
            if (!buffer) buffer = ev.answer || "";
            out.innerHTML = md(buffer);
            renderSources(el, ev.citations || []);
            if (ev.verdict && ev.verdict.ok === false) {
              out.innerHTML += '<p class="err">⚠️ Câu trả lời chưa được kiểm chứng đầy đủ.</p>';
            }
            actDone(ev);
            loadSessions(state.sid);
          }
        }
      }
    }
    if (raf) cancelAnimationFrame(raf);
    paint();
  } catch (e) {
    if (status) status.remove();
    actError(String(e));
    out.innerHTML = `<p class="err">Không gọi được API: ${esc(String(e))}</p>`;
  } finally {
    setBusy(false);
    $("#q").focus();
    scrollDown();
  }
}

$("#composer").addEventListener("submit", (e) => { e.preventDefault(); send(); });
$("#new").addEventListener("click", newSession);
$("#q").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 180) + "px";
});
$("#q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
wrap.addEventListener("click", (e) => {
  if (!e.target.classList.contains("cite")) return;
  const box = e.target.closest(".msg").querySelector(".sources");
  if (box && !box.hidden) {
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
});

// ---- cot "Hoat dong": an/hien + keo gian ----
const ACT_KEY = "activityHidden";
if (window.innerWidth <= 1100) app.classList.add("act-hidden");
else if (localStorage.getItem(ACT_KEY) === "1") app.classList.add("act-hidden");

$("#act-toggle").addEventListener("click", () => {
  const hidden = app.classList.toggle("act-hidden");
  if (window.innerWidth > 1100) localStorage.setItem(ACT_KEY, hidden ? "1" : "0");
});
$("#act-backdrop").addEventListener("click", () => app.classList.add("act-hidden"));

const resizer = $("#resizer");
const MIN_W = 240, MAX_W = 480, DEF_W = 300;
function setActWidth(w) {
  w = Math.round(Math.max(MIN_W, Math.min(MAX_W, w)));
  app.style.setProperty("--activity-w", w + "px");
  return w;
}
const storedW = parseInt(localStorage.getItem("activityWidth") || "", 10);
if (storedW >= MIN_W && storedW <= MAX_W) setActWidth(storedW);

let dragging = false;
resizer.addEventListener("pointerdown", (e) => {
  dragging = true;
  resizer.classList.add("dragging");
  resizer.setPointerCapture(e.pointerId);
  document.body.style.userSelect = "none";
  document.body.style.cursor = "col-resize";
});
resizer.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  setActWidth(window.innerWidth - e.clientX);
});
function stopDrag() {
  if (!dragging) return;
  dragging = false;
  resizer.classList.remove("dragging");
  document.body.style.userSelect = "";
  document.body.style.cursor = "";
  const w = parseInt(getComputedStyle(app).getPropertyValue("--activity-w"), 10);
  if (w) localStorage.setItem("activityWidth", String(w));
}
resizer.addEventListener("pointerup", stopDrag);
resizer.addEventListener("pointercancel", stopDrag);
resizer.addEventListener("dblclick", () => {
  setActWidth(DEF_W);
  localStorage.setItem("activityWidth", String(DEF_W));
});
resizer.addEventListener("keydown", (e) => {
  const cur = parseInt(getComputedStyle(app).getPropertyValue("--activity-w"), 10) || DEF_W;
  if (e.key === "ArrowLeft") {
    e.preventDefault();
    localStorage.setItem("activityWidth", String(setActWidth(cur + 20)));
  } else if (e.key === "ArrowRight") {
    e.preventDefault();
    localStorage.setItem("activityWidth", String(setActWidth(cur - 20)));
  }
});

loadHealth();
clearChat();
loadSessions(null);
</script>
