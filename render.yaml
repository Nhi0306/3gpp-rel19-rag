services:
  - type: web
    name: 3gpp-rel19-rag
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: RAG_PROFILE
        value: cheap
      - key: RAG_MAX_REFINE
        value: "1"
      - key: RAG_DAILY_LIMIT
        value: "100"
      - key: RAG_RATE_PER_MIN
        value: "10"
      - key: RAG_MAX_QUESTION_CHARS
        value: "2000"
      - key: QDRANT_COLLECTION
        value: 3gpp_rel19
      - key: SPARSE_COLLECTION
        value: 3gpp_rel19_sparse
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
